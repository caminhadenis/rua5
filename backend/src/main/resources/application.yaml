spring:
  application:
    name: jogo-rua-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jogorua}
    username: ${DB_USER:jogorua}
    password: ${DB_PASSWORD:jogorua}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

