spring:
  application:
    name: jogo-rua-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jogorua}
    username: ${DB_USER:jogorua}
    password: ${DB_PASSWORD:jogorua}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        max-age: 7d
        same-site: lax

