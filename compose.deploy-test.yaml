# Isolated local rehearsal of the cloud image; never uses the local game database.
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.render
    environment:
      PORT: 10000
      SPRING_PROFILES_ACTIVE: production
      # This rehearsal uses HTTP on loopback; cloud cookies remain Secure.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      DB_URL: jdbc:postgresql://postgres:5432/rua5_deploy_test
      DB_USER: deploy_test
      DB_PASSWORD: local-deploy-test-only
    ports:
      - "127.0.0.1:${DEPLOY_TEST_PORT:-5176}:10000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: rua5_deploy_test
      POSTGRES_USER: deploy_test
      POSTGRES_PASSWORD: local-deploy-test-only
    volumes:
      - deploy-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy_test -d rua5_deploy_test"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  deploy-test-data:
